<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow" />
<title>RCI Tutoring — HHA AI Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2330;
    --border: #2a3441;
    --accent: #7c3aed;
    --accent2: #a78bfa;
    --gold: #d4a843;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-dimmer: #484f58;
    --user-bubble: #1f1533;
    --ai-bubble: #161b22;
    --success: #3fb950;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 12px;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }

  .logo-area img {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: contain;
    background: #fff;
    padding: 2px;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .logo-title {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.2px;
  }

  .logo-sub {
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .back-link {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--text); }

  .lang-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
  }

  .lang-btn {
    padding: 4px 10px;
    cursor: pointer;
    color: var(--text-dim);
    transition: all 0.2s;
    border: none;
    background: transparent;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
  }

  .lang-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .topic-bar {
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
    background: var(--surface2);
  }

  .topic-bar::-webkit-scrollbar { display: none; }

  .topic-pill {
    white-space: nowrap;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Mono', monospace;
    background: transparent;
    letter-spacing: 0.3px;
  }

  .topic-pill:hover, .topic-pill.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124, 58, 237, 0.08);
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .welcome {
    text-align: center;
    padding: 32px 20px;
    max-width: 500px;
    margin: 0 auto;
  }

  .welcome-icon { font-size: 32px; margin-bottom: 14px; }

  .welcome-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .welcome-sub {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .suggestion-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    text-align: left;
  }

  .suggestion-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .suggestion-card:hover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(124, 58, 237, 0.05);
  }

  .suggestion-card .s-icon {
    font-size: 16px;
    margin-bottom: 6px;
    display: block;
  }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeSlide 0.3s ease;
    max-width: 100%;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
  }

  .msg.ai .msg-avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }

  .msg.user .msg-avatar {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .msg-bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13.5px;
    line-height: 1.7;
  }

  .msg.ai .msg-bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    color: var(--text);
    border-top-left-radius: 4px;
  }

  .msg.user .msg-bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(124, 58, 237, 0.25);
    color: var(--text);
    border-top-right-radius: 4px;
  }

  .msg-bubble strong { color: var(--accent2); font-weight: 700; }
  .msg-bubble em { color: var(--gold); font-style: normal; font-family: 'DM Mono', monospace; font-size: 12px; }

  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-top-left-radius: 4px;
    width: fit-content;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within { border-color: var(--accent); }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-size: 13.5px;
    font-weight: 300;
    resize: none;
    max-height: 120px;
    min-height: 22px;
    line-height: 1.5;
  }

  #user-input::placeholder { color: var(--text-dimmer); }

  .send-btn {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

  .send-btn svg { width: 14px; height: 14px; fill: #fff; }

  .input-hint {
    margin-top: 7px;
    font-size: 10px;
    color: var(--text-dimmer);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
    text-align: center;
  }

  .msg-bubble ul { padding-left: 18px; margin: 6px 0; }
  .msg-bubble li { margin: 3px 0; color: var(--text); }
  .msg-bubble p { margin-bottom: 8px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
</style>
  <!-- Meta Pixel -->
  <script src="../../../assets/meta-pixel.js"></script>
</head>
<body>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=22328706637567894&amp;ev=PageView&amp;noscript=1" alt="" /></noscript>

<div class="header">
  <a class="logo-area" href="../../../">

  </a>
  <div class="header-right">

<div class="topic-bar" id="topic-bar"></div>

<div class="chat-area" id="chat-area">
  <div class="welcome" id="welcome-block">
    <div class="welcome-icon">&#x1F3E0;</div>
    <div class="welcome-title" id="welcome-title">Tu tutor para el examen HHA</div>
    <div class="welcome-sub" id="welcome-sub">Haz cualquier pregunta sobre cuidado en el hogar, seguridad del paciente, ADLs, o preparaci&oacute;n para el examen HHA.</div>
    <div class="suggestion-grid" id="suggestion-grid"></div>

<div class="input-area">
  <div class="input-row">
    <textarea id="user-input" rows="1" placeholder="Haz una pregunta sobre HHA..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="input-hint" id="input-hint">RCI Tutoring &middot; Contenido educativo — No reemplaza criterio cl&iacute;nico institucional</div>
</div>

<script>
  const API_ENDPOINT = 'https://rci-tutor-proxy.jnannum-rn.workers.dev';

  let lang = localStorage.getItem('rci_lang') || 'es';
  let isLoading = false;
  const messages = [];

  const savedHistory = sessionStorage.getItem('rci_hha_chat_history');
  if (savedHistory) {
    try {
      const parsed = JSON.parse(savedHistory);
      parsed.forEach(function(m) { messages.push(m); });
    } catch(e) {}
  }

  const i18n = {
    es: {
      status: 'En l\u00ednea',
      backText: 'Modalidades',
      welcomeTitle: 'Tu tutor para el examen HHA',
      welcomeSub: 'Haz cualquier pregunta sobre cuidado en el hogar, seguridad del paciente, ADLs, nutrici\u00f3n, o preparaci\u00f3n para el examen HHA. Estoy aqu\u00ed para ayudarte a entender \u2014 no solo a memorizar.',
      placeholder: 'Haz una pregunta sobre HHA...',
      hint: 'RCI Tutoring \u00b7 Contenido educativo \u2014 No reemplaza criterio cl\u00ednico institucional',
      topics: ['Cuidado en el hogar','Seguridad','ADLs','Nutrici\u00f3n','Signos vitales','Emergencias','Comunicaci\u00f3n','Tipo examen HHA'],
      suggestions: [
        { icon: '\uD83C\uDFE0', text: '\u00bfCu\u00e1les son las responsabilidades principales de un HHA?' },
        { icon: '\uD83D\uDEE1\uFE0F', text: '\u00bfC\u00f3mo se mantiene la seguridad en el hogar del paciente?' },
        { icon: '\uD83C\uDF5E', text: '\u00bfQu\u00e9 consideraciones nutricionales debe saber un HHA?' },
        { icon: '\uD83D\uDCCB', text: '\u00bfQu\u00e9 temas cubre el examen HHA?' },
      ],
      you: 'T\u00da',
      systemPrompt: 'Eres un tutor cl\u00ednico especializado en la preparaci\u00f3n del examen HHA (Home Health Aide / Home Attendant) para RCI Tutoring. Tu misi\u00f3n es ense\u00f1ar conceptos de cuidado en el hogar, seguridad del paciente, actividades de la vida diaria, nutrici\u00f3n, signos vitales, comunicaci\u00f3n, y preparaci\u00f3n para el examen estatal HHA.\n\nDominios principales del examen HHA:\n1. Cuidado personal en el hogar: ba\u00f1o, vestido, higiene, cuidado oral, cuidado del cabello\n2. Seguridad en el hogar: prevenci\u00f3n de ca\u00eddas, manejo de emergencias, seguridad contra incendios, plan de evacuaci\u00f3n\n3. Nutrici\u00f3n y preparaci\u00f3n de alimentos: dietas especiales, hidrataci\u00f3n, alimentaci\u00f3n asistida, seguridad alimentaria\n4. Signos vitales y observaciones: temperatura, pulso, respiraci\u00f3n, presi\u00f3n arterial, reconocer cambios\n5. Control de infecciones en el hogar: lavado de manos, limpieza, desinfecci\u00f3n, precauciones universales\n6. Movilidad y transferencias: mec\u00e1nica corporal, uso de andador/silla de ruedas, prevenci\u00f3n de ca\u00eddas\n7. Manejo de medicamentos: recordatorios, almacenamiento, NO administrar (solo asistir)\n8. Comunicaci\u00f3n y documentaci\u00f3n: reporte al supervisor, registro de actividades, comunicaci\u00f3n con la familia\n9. Cuidado de condiciones cr\u00f3nicas: diabetes, demencia, enfermedades card\u00edacas, EPOC\n10. Apoyo emocional y social: compa\u00f1\u00eda, estimulaci\u00f3n, derechos del paciente, dignidad\n11. Tareas del hogar: limpieza ligera, lavander\u00eda, compras, organizaci\u00f3n\n\nResponde siempre en espa\u00f1ol a menos que el usuario escriba en ingl\u00e9s.\nUsa lenguaje accesible pero t\u00e9cnicamente preciso.\nCuando sea \u00fatil, estructura tu respuesta con puntos clave o pasos.\nAl final de respuestas largas, puedes agregar una pregunta de reflexi\u00f3n tipo examen.\nJam\u00e1s inventes informaci\u00f3n cl\u00ednica. Si algo requiere validaci\u00f3n institucional, dilo.\nMant\u00e9n un tono profesional, c\u00e1lido y pedag\u00f3gico \u2014 como un colega con experiencia que genuinamente quiere que el estudiante entienda.'
    },
    en: {
      status: 'Online',
      backText: 'Study Modes',
      welcomeTitle: 'Your HHA exam tutor',
      welcomeSub: "Ask anything about home care, patient safety, ADLs, nutrition, or HHA exam prep. I'm here to help you truly understand \u2014 not just memorize.",
      placeholder: 'Ask an HHA question...',
      hint: 'RCI Tutoring \u00b7 Educational content \u2014 Does not replace institutional clinical judgment',
      topics: ['Home Care','Safety','ADLs','Nutrition','Vital Signs','Emergencies','Communication','HHA Exam Prep'],
      suggestions: [
        { icon: '\uD83C\uDFE0', text: 'What are the main responsibilities of an HHA?' },
        { icon: '\uD83D\uDEE1\uFE0F', text: 'How do you maintain safety in the patient\'s home?' },
        { icon: '\uD83C\uDF5E', text: 'What nutritional considerations should an HHA know?' },
        { icon: '\uD83D\uDCCB', text: 'What topics does the HHA exam cover?' },
      ],
      you: 'YOU',
      systemPrompt: 'You are a clinical tutor specialized in HHA (Home Health Aide / Home Attendant) exam preparation for RCI Tutoring. Your mission is to teach home care concepts, patient safety, activities of daily living, nutrition, vital signs, communication, and state HHA exam preparation.\n\nMain HHA exam domains:\n1. Personal care in the home: bathing, dressing, hygiene, oral care, hair care\n2. Home safety: fall prevention, emergency management, fire safety, evacuation plans\n3. Nutrition & meal preparation: special diets, hydration, assisted feeding, food safety\n4. Vital signs & observations: temperature, pulse, respiration, blood pressure, recognizing changes\n5. Infection control in the home: hand washing, cleaning, disinfection, universal precautions\n6. Mobility & transfers: body mechanics, walker/wheelchair use, fall prevention\n7. Medication management: reminders, storage, NOT administering (only assisting)\n8. Communication & documentation: reporting to supervisor, activity logs, family communication\n9. Chronic condition care: diabetes, dementia, heart disease, COPD\n10. Emotional & social support: companionship, stimulation, patient rights, dignity\n11. Homemaking tasks: light cleaning, laundry, shopping, organization\n\nRespond in English by default. If the user writes in Spanish, respond in Spanish.\nUse accessible but technically precise language.\nWhen helpful, structure your response with key points or steps.\nAt the end of longer responses, you may add a reflection question in exam style.\nNever fabricate clinical information. If something requires institutional validation, say so.\nMaintain a professional, warm, and pedagogical tone \u2014 like a colleague with experience who genuinely wants the student to understand.'
    }
  };

  function setLang(l) {
    lang = l;
    localStorage.setItem('rci_lang', l);
    document.getElementById('btn-es').classList.toggle('active', l === 'es');
    document.getElementById('btn-en').classList.toggle('active', l === 'en');
    var t = i18n[l];
    document.getElementById('status-label').textContent = t.status;
    document.getElementById('back-text').textContent = t.backText;
    document.getElementById('welcome-title').textContent = t.welcomeTitle;
    document.getElementById('welcome-sub').textContent = t.welcomeSub;
    document.getElementById('user-input').placeholder = t.placeholder;
    document.getElementById('input-hint').textContent = t.hint;
    renderTopics();
    renderSuggestions();
  }

  function renderTopics() {
    var bar = document.getElementById('topic-bar');
    bar.innerHTML = i18n[lang].topics.map(function(t) {
      return '<button class="topic-pill" onclick="injectTopic(this.textContent)">' + t + '</button>';
    }).join('');
  }

  function renderSuggestions() {
    var grid = document.getElementById('suggestion-grid');
    if (!grid) return;
    grid.innerHTML = i18n[lang].suggestions.map(function(s, i) {
      return '<div class="suggestion-card" onclick="injectSuggestion(' + i + ')">' +
        '<span class="s-icon">' + s.icon + '</span>' + s.text +
      '</div>';
    }).join('');
  }

  function injectTopic(topic) {
    var input = document.getElementById('user-input');
    input.value = topic + ': ';
    input.focus();
  }

  function injectSuggestion(index) {
    var text = i18n[lang].suggestions[index].text;
    document.getElementById('user-input').value = text;
    sendMessage();
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function hideWelcome() {
    var w = document.getElementById('welcome-block');
    if (w) w.remove();
  }

  function appendMessage(role, html) {
    hideWelcome();
    var area = document.getElementById('chat-area');
    var t = i18n[lang];
    var isUser = role === 'user';
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML =
      '<div class="msg-avatar">' + (isUser ? t.you[0] : '\u2666') + '</div>' +
      '<div class="msg-bubble">' + html + '</div>';
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return div;
  }

  function showTyping() {
    hideWelcome();
    var area = document.getElementById('chat-area');
    var div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'typing-indicator';
    div.innerHTML =
      '<div class="msg-avatar">\u2666</div>' +
      '<div class="typing"><span></span><span></span><span></span></div>';
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function removeTyping() {
    var t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatResponse(text) {
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    text = text.replace(/^[-\u2022]\s(.+)$/gm, '<li>$1</li>');
    text = text.replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>');
    var lines = text.split('\n\n').filter(Boolean);
    return lines.map(function(l) {
      if (l.indexOf('<li>') !== -1) return '<ul>' + l + '</ul>';
      return '<p>' + l.replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function saveChatHistory() {
    sessionStorage.setItem('rci_hha_chat_history', JSON.stringify(messages));
  }

  function restoreMessages() {
    if (messages.length > 0) {
      hideWelcome();
      messages.forEach(function(m) {
        if (m.role === 'user') {
          appendMessage('user', escapeHtml(m.content));
        } else if (m.role === 'assistant') {
          appendMessage('ai', formatResponse(m.content));
        }
      });
    }
  }

  async function sendMessage() {
    if (isLoading) return;
    var input = document.getElementById('user-input');
    var text = input.value.trim();
    if (!text) return;

    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    messages.push({ role: 'user', content: text });
    saveChatHistory();
    appendMessage('user', escapeHtml(text));
    showTyping();

    try {
      var t = i18n[lang];
      var response = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: t.systemPrompt,
          messages: messages
        })
      });

      var data = await response.json();

      if (data.error) {
        removeTyping();
        var errorMsg = lang === 'es'
          ? '<p style="color:#f85149">Error: ' + escapeHtml(data.error.message || 'Servicio no disponible.') + '</p>'
          : '<p style="color:#f85149">Error: ' + escapeHtml(data.error.message || 'Service unavailable.') + '</p>';
        appendMessage('ai', errorMsg);
        messages.pop();
        saveChatHistory();
      } else {
        var reply = data.content && data.content[0] ? data.content[0].text : '...';
        messages.push({ role: 'assistant', content: reply });
        saveChatHistory();
        removeTyping();
        appendMessage('ai', formatResponse(reply));
      }
    } catch (err) {
      removeTyping();
      var errorMsg2 = lang === 'es'
        ? '<p style="color:#f85149">Error de conexi\u00f3n. Intenta de nuevo.</p>'
        : '<p style="color:#f85149">Connection error. Please try again.</p>';
      appendMessage('ai', errorMsg2);
      messages.pop();
      saveChatHistory();
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  // Init
  setLang(lang);
  restoreMessages();
</script>
<script src="../../../assets/cookie-banner.js"></script>
</body>
