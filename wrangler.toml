# RCI Tutoring — Cloudflare Pages + D1 Configuration
name = "rci-tutoring"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

[vars]
STRIPE_MODE = "live"
APP_URL = "https://rcitutoring.com"
SUPPORT_EMAIL = "support@rcitutoring.com"

# Secrets (set via Cloudflare Dashboard or wrangler secret put):
# STRIPE_SECRET_KEY      — sk_live_XXXX
# STRIPE_PUBLISHABLE_KEY — pk_live_XXXX
# STRIPE_WEBHOOK_SECRET  — whsec_XXXX
# JWT_SECRET             — random secure string (32+ chars)
# RESEND_API_KEY         — re_XXXX
# EMAIL_FROM             — 'RCI Tutoring <noreply@rcitutoring.com>' (requires verified domain in Resend)
# CRON_SECRET            — random secure string for /api/cron-emails auth
# TURNSTILE_SECRET_KEY   — 0x_XXXX (when unset the server-side Turnstile check is skipped.
#                          Matching public site key: TURNSTILE_SITE_KEY in register.html)

[[d1_databases]]
binding = "DB"
database_name = "rci-tutoring-db"
database_id = "d4cbe54c-998d-49e0-bc4a-a4ce01d732e0"
