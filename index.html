<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCI Tutoring</title>
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f7f9fb;
      color: #1a2a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    img {
      max-width: 160px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      color: #4a5a6a;
      margin: 6px 0;
    }

    .divider {
      margin: 20px 0;
      height: 1px;
      background: #dce3ea;
    }

    .small {
      font-size: 13px;
      color: #7a8a9a;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- LOGO -->
    <img src="logo.png" alt="Renal Care Institute Logo">

    <!-- TITLE -->
    <h1>RCI Tutoring</h1>

    <!-- ENGLISH -->
    <p>Hemodialysis Tutoring for Healthcare Professionals</p>
    <p><strong>Coming Soon</strong></p>

    <div class="divider"></div>

    <!-- SPANISH -->
    <p>Tutoría educativa en hemodiálisis para profesionales de la salud</p>
    <p><strong>Próximamente</strong></p>

    <div class="small">
      Renal Care Institute
    </div>

  </div>
</body>
</html>
